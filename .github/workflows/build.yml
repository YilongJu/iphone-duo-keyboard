name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    name: Unsigned .ipa for the device
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        run: xcodegen generate
      - name: Build for the device with signing off
        run: |
          set -o pipefail
          xcodebuild \
            -project DuoKeyboard.xcodeproj \
            -scheme DuoKeyboard \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | xcbeautify
      - name: Package the .ipa
        run: |
          set -euo pipefail
          app=build/Build/Products/Release-iphoneos/DuoKeyboard.app
          test -d "$app/PlugIns/DuoKeyboardExtension.appex"
          mkdir Payload
          cp -R "$app" Payload/
          zip -qry DuoKeyboard-unsigned.ipa Payload
          ls -l DuoKeyboard-unsigned.ipa
      - uses: actions/upload-artifact@v7
        with:
          name: DuoKeyboard-unsigned-ipa
          path: DuoKeyboard-unsigned.ipa
          if-no-files-found: error

  tests:
    name: Layout check and unit tests
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Check the layout file against the layout rules
        run: python3 scripts/keyboard-preview/check_layout.py
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        run: xcodegen generate
      - name: Run the unit tests in a simulator
        env:
          # xcodebuild hands a variable to the test process when its name starts with TEST_RUNNER_.
          # The typing evaluation reads its cases from the first folder and writes to the second.
          TEST_RUNNER_TYPING_CASES_DIR: ${{ github.workspace }}/scripts/typing-evaluation/cases
          TEST_RUNNER_TYPING_OUTPUT_DIR: ${{ github.workspace }}/build/typing-evaluation/shipping-keyboard
        run: |
          set -o pipefail
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              for device in devices[runtime]:
                  if device["name"].startswith("iPhone 17"):
                      print(device["udid"])
                      sys.exit(0)
          sys.exit("simulator not found: iPhone 17")
          ')
          xcodebuild test \
            -project DuoKeyboard.xcodeproj \
            -scheme DuoKeyboard \
            -destination "platform=iOS Simulator,id=$udid" \
            -derivedDataPath build-test | xcbeautify
      - name: Score the shipping keyboard on the typing test cases
        run: |
          set -euo pipefail
          cases=scripts/typing-evaluation/cases
          outputs=build/typing-evaluation/shipping-keyboard
          for task in english pinyin; do
            for half in dev test; do
              python3 scripts/typing-evaluation/score.py --task "$task" --engine shipping-keyboard \
                --cases "$cases/$task.$half.jsonl" --predictions "$outputs/$task.$half.jsonl" \
                --json "$outputs/$task.$half.summary.json"
            done
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: typing-evaluation-shipping-keyboard
          path: build/typing-evaluation/shipping-keyboard
          if-no-files-found: error

  screenshots:
    name: Simulator screenshots of the keyboard
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        run: xcodegen generate
      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project DuoKeyboard.xcodeproj \
            -scheme DuoKeyboard \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO \
            build | xcbeautify
      - name: Capture screenshots
        run: bash scripts/ci/capture_screenshots.sh build-sim/Build/Products/Debug-iphonesimulator/DuoKeyboard.app screenshots
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: error
