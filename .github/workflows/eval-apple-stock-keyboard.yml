name: Typing evaluation of the Apple stock keyboard

# Measures Apple's own keyboards on the typing test cases, as the reference line for the other
# engines. The keyboard jobs tap the keys of the software keyboard in the iOS Simulator. The
# nsspellchecker job asks the spell checker of macOS for its corrections. The collect job merges
# the parts of the other jobs and runs score.py for each engine name and half.
# The README of scripts/typing-evaluation/engines/apple-stock-keyboard explains the measurement.
on:
  push:
    branches: ['eval/apple-stock-keyboard']
    paths-ignore:
      - '**/README.md'
      - 'scripts/typing-evaluation/results/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: eval-apple-stock-keyboard
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  ENGINE_DIR: scripts/typing-evaluation/engines/apple-stock-keyboard
  PARTS_DIR: build/typing-evaluation-parts
  SAMPLE_SEED: '20261109'
  # The number of cases each simulator types. 0 types the whole shard, and a small number gives a short trial.
  SHARD_LIMIT: '0'

jobs:
  keyboard:
    name: ${{ matrix.engine }} ${{ matrix.task }} ${{ matrix.half }} shards ${{ matrix.shard_list }}
    runs-on: xcode-27
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        # share is the share of each stratum that sample_cases.py draws. shards is the number of
        # shards of the sample, and shard_list names the shards this job types. The job types
        # each shard on its own new simulator. A new simulator takes 7 to 12 minutes before the
        # first key tap, so each job types one shard. A Pinyin sample has 8 shards, so one
        # simulator types each clause one time. control: 'yes' turns every correction of the
        # text view off, and that job types the first of 4 shards of the English dev sample.
        include:
          - {engine: apple-stock-keyboard-control, task: english, half: dev, share: '0.2', shards: 4, shard_list: '0', control: 'yes'}
          - {engine: apple-stock-keyboard, task: english, half: dev, share: '0.2', shards: 2, shard_list: '0', control: 'no'}
          - {engine: apple-stock-keyboard, task: english, half: dev, share: '0.2', shards: 2, shard_list: '1', control: 'no'}
          - {engine: apple-stock-keyboard, task: pinyin, half: dev, share: '0.12', shards: 8, shard_list: '0', control: 'no'}
          - {engine: apple-stock-keyboard, task: pinyin, half: dev, share: '0.12', shards: 8, shard_list: '1', control: 'no'}
          - {engine: apple-stock-keyboard, task: pinyin, half: dev, share: '0.12', shards: 8, shard_list: '2', control: 'no'}
          - {engine: apple-stock-keyboard, task: pinyin, half: dev, share: '0.12', shards: 8, shard_list: '3', control: 'no'}
          - {engine: apple-stock-keyboard, task: pinyin, half: dev, share: '0.12', shards: 8, shard_list: '4', control: 'no'}
          - {engine: apple-stock-keyboard, task: pinyin, half: dev, share: '0.12', shards: 8, shard_list: '5', control: 'no'}
          - {engine: apple-stock-keyboard, task: pinyin, half: dev, share: '0.12', shards: 8, shard_list: '6', control: 'no'}
          - {engine: apple-stock-keyboard, task: pinyin, half: dev, share: '0.12', shards: 8, shard_list: '7', control: 'no'}
          - {engine: apple-stock-keyboard, task: english, half: test, share: '0.2', shards: 2, shard_list: '0', control: 'no'}
          - {engine: apple-stock-keyboard, task: english, half: test, share: '0.2', shards: 2, shard_list: '1', control: 'no'}
          - {engine: apple-stock-keyboard, task: pinyin, half: test, share: '0.12', shards: 8, shard_list: '0', control: 'no'}
          - {engine: apple-stock-keyboard, task: pinyin, half: test, share: '0.12', shards: 8, shard_list: '1', control: 'no'}
          - {engine: apple-stock-keyboard, task: pinyin, half: test, share: '0.12', shards: 8, shard_list: '2', control: 'no'}
          - {engine: apple-stock-keyboard, task: pinyin, half: test, share: '0.12', shards: 8, shard_list: '3', control: 'no'}
          - {engine: apple-stock-keyboard, task: pinyin, half: test, share: '0.12', shards: 8, shard_list: '4', control: 'no'}
          - {engine: apple-stock-keyboard, task: pinyin, half: test, share: '0.12', shards: 8, shard_list: '5', control: 'no'}
          - {engine: apple-stock-keyboard, task: pinyin, half: test, share: '0.12', shards: 8, shard_list: '6', control: 'no'}
          - {engine: apple-stock-keyboard, task: pinyin, half: test, share: '0.12', shards: 8, shard_list: '7', control: 'no'}
    env:
      PART_PREFIX: apple-stock-keyboard-part-${{ matrix.engine }}-${{ matrix.task }}-${{ matrix.half }}
      KEY_INTERVAL: '0.33'
    steps:
      - uses: actions/checkout@v7
      - name: Print the versions of macOS, Xcode and the simulator runtimes
        run: |
          sw_vers
          xcodebuild -version
          xcrun simctl list runtimes
          python3 --version
      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version
      - name: Sample the cases with a fixed seed
        run: |
          set -euo pipefail
          for shard in ${{ matrix.shard_list }}; do
            part="$PARTS_DIR/$PART_PREFIX-$shard"
            mkdir -p "$part"
            python3 "$ENGINE_DIR/sample_cases.py" --task "${{ matrix.task }}" \
              --cases "scripts/typing-evaluation/cases/${{ matrix.task }}.${{ matrix.half }}.jsonl" \
              --share ${{ matrix.share }} --limit "$SHARD_LIMIT" --seed "$SAMPLE_SEED" \
              --shard "$shard" --shards ${{ matrix.shards }} \
              --sample-out "$part/sample.jsonl" --shard-out "$part/cases.jsonl"
            if [ "${{ matrix.control }}" = yes ]; then control=true; else control=false; fi
            printf '{"kind": "keyboard", "engine": "%s", "task": "%s", "half": "%s", "shard": %s, "shards": %s, "key_interval": %s, "share": %s, "limit": %s, "seed": %s, "control": %s}\n' \
              "${{ matrix.engine }}" "${{ matrix.task }}" "${{ matrix.half }}" "$shard" "${{ matrix.shards }}" \
              "$KEY_INTERVAL" "${{ matrix.share }}" "$SHARD_LIMIT" "$SAMPLE_SEED" "$control" > "$part/part.json"
            cat "$part/part.json"
          done
      - name: Generate the Xcode project
        run: |
          cd "$ENGINE_DIR"
          xcodegen generate
      - name: Create the simulator of the first shard
        run: |
          set -euo pipefail
          udid=$(bash "$ENGINE_DIR/simulator.sh" create "typing-evaluation-first")
          echo "simulator $udid"
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
      - name: Build the host app and the UI test
        run: |
          set -euo pipefail
          mkdir -p build/apple-stock-keyboard-logs
          log=build/apple-stock-keyboard-logs/xcodebuild-build.log
          if ! xcodebuild build-for-testing \
              -project "$ENGINE_DIR/StockKeyboardHost.xcodeproj" -scheme StockKeyboardHost \
              -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
              -derivedDataPath build/apple-stock-keyboard-derived > "$log" 2>&1; then
            grep -n -E "error|warning: " "$log" | head -n 120 || true
            tail -n 60 "$log"
            exit 1
          fi
          grep -E "warning: " "$log" | sort -u | head -n 40 || true
          tail -n 4 "$log"
      - name: Type each shard on the stock keyboard of its own new simulator
        run: |
          set -uo pipefail
          failed=0
          udid="$SIMULATOR_UDID"
          for shard in ${{ matrix.shard_list }}; do
            part="$PARTS_DIR/$PART_PREFIX-$shard"
            if [ -z "$udid" ]; then
              udid=$(bash "$ENGINE_DIR/simulator.sh" create "typing-evaluation-shard-$shard") || exit 1
            fi
            echo "== shard $shard on simulator $udid"
            bash "$ENGINE_DIR/simulator.sh" configure "$udid" "${{ matrix.task }}" > "$part/simulator.log" 2>&1
            configured=$?
            grep -v -E "RequiredAssets|\.lm$|^[A-Za-z_-]{2,6}$|\.plist$" "$part/simulator.log"
            if [ "$configured" != 0 ]; then
              echo "::error::the simulator of shard $shard did not take its settings"
              exit 1
            fi
            # xcodebuild hands a variable to the test process when its name starts with TEST_RUNNER_.
            export TEST_RUNNER_EVAL_TASK="${{ matrix.task }}"
            export TEST_RUNNER_EVAL_KEY_INTERVAL="$KEY_INTERVAL"
            export TEST_RUNNER_EVAL_CONTROL="${{ matrix.control }}"
            export TEST_RUNNER_EVAL_CASES_FILE="$PWD/$part/cases.jsonl"
            export TEST_RUNNER_EVAL_OUTPUT_DIR="$PWD/$part"
            # The test runner can stop before the first case, while the new simulator is still
            # busy. The job starts the test one more time only when the test typed no case.
            for start in 1 2; do
              xcodebuild test-without-building \
                -project "$ENGINE_DIR/StockKeyboardHost.xcodeproj" -scheme StockKeyboardHost \
                -destination "platform=iOS Simulator,id=$udid" \
                -derivedDataPath build/apple-stock-keyboard-derived \
                -parallel-testing-enabled NO -test-timeouts-enabled NO > "$part/xcodebuild-test-$start.log" 2>&1
              status=$?
              grep -E "^EVAL_(START|PASS|KEYS|WARMUP|NOTE|DONE)|error:|encountered an error|\*\* TEST" "$part/xcodebuild-test-$start.log"
              if [ -s "$part/attempts.jsonl" ]; then break; fi
              echo "::warning::shard $shard: start $start of the test typed no case, xcodebuild exit status $status"
            done
            # The shard passes when the text view was read for every case. XCTest can report a
            # failure for a read that the test repeated with success.
            total=$(grep -c . "$part/cases.jsonl")
            if [ -f "$part/attempts.jsonl" ]; then
              typed=$(python3 -c 'import json, sys; print(len({json.loads(line)["id"] for line in open(sys.argv[1], encoding="utf-8") if "after" in json.loads(line)}))' "$part/attempts.jsonl")
            else
              typed="no attempts file"
            fi
            echo "shard $shard: xcodebuild exit status $status, text view read for $typed of $total cases"
            if [ "$status" != 0 ]; then echo "::warning::xcodebuild exit status $status in shard $shard"; fi
            if [ "$typed" != "$total" ]; then
              echo "::error::shard $shard: text view read for $typed of $total cases"
              failed=1
            fi
            xcrun simctl shutdown "$udid" || echo "::warning::the simulator $udid did not shut down"
            xcrun simctl delete "$udid" || echo "::warning::the simulator $udid was not deleted"
            udid=""
          done
          exit "$failed"
      - name: Show the outputs and the checks of the shards of this job
        if: always()
        run: |
          set -euo pipefail
          python3 "$ENGINE_DIR/collect_outputs.py" --parts "$PARTS_DIR" --out build/typing-evaluation
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ env.PART_PREFIX }}-job-${{ strategy.job-index }}
          path: |
            build/typing-evaluation-parts
            build/apple-stock-keyboard-logs
          if-no-files-found: error

  nsspellchecker:
    name: apple-nsspellchecker on all English cases
    # The job waits for the keyboard jobs, so the workflow holds at most four runners at a time.
    needs: [keyboard]
    if: ${{ !cancelled() }}
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      PART: apple-stock-keyboard-part-nsspellchecker
    steps:
      - uses: actions/checkout@v7
      - name: Print the versions of macOS, Xcode and Swift
        run: |
          sw_vers
          xcodebuild -version
          swiftc --version
      - name: Build the command-line tool
        run: |
          set -euo pipefail
          mkdir -p build/apple-nsspellchecker
          swiftc -O "$ENGINE_DIR/NSSpellCheckerTool/main.swift" -o build/apple-nsspellchecker/nsspellchecker
      - name: Correct each token of all English cases
        run: |
          set -euo pipefail
          outputs="$PARTS_DIR/$PART/outputs"
          for half in dev test; do
            for mode in context word; do
              if [ "$mode" = context ]; then name=apple-nsspellchecker; else name=apple-nsspellchecker-word-alone; fi
              mkdir -p "$outputs/$name"
              build/apple-nsspellchecker/nsspellchecker "$mode" \
                "scripts/typing-evaluation/cases/english.$half.jsonl" "$outputs/$name/english.$half.jsonl"
            done
          done
          echo '{"kind": "outputs"}' > "$PARTS_DIR/$PART/part.json"
      - name: Score the outputs of this part
        run: |
          set -euo pipefail
          python3 "$ENGINE_DIR/collect_outputs.py" --parts "$PARTS_DIR" --out build/typing-evaluation
          bash "$ENGINE_DIR/score_outputs.sh" build/typing-evaluation
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ env.PART }}
          path: build/typing-evaluation-parts/${{ env.PART }}
          if-no-files-found: error

  collect:
    name: Merge the parts and score each engine name
    needs: [keyboard, nsspellchecker]
    if: ${{ !cancelled() }}
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Download the parts of this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$PARTS_DIR"
          gh run download "${{ github.run_id }}" --repo "${{ github.repository }}" \
            --pattern 'apple-stock-keyboard-part-*' --dir "$PARTS_DIR"
          ls "$PARTS_DIR"/*
      - name: Merge the parts into one folder per engine name
        run: python3 "$ENGINE_DIR/collect_outputs.py" --parts "$PARTS_DIR" --out build/typing-evaluation
      - name: Score each engine name and half
        run: bash "$ENGINE_DIR/score_outputs.sh" build/typing-evaluation
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: typing-evaluation-apple-stock-keyboard
          path: build/typing-evaluation
          if-no-files-found: error
