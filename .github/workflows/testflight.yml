name: TestFlight

# Signs the app with the Apple Developer Program team and uploads the build to TestFlight.
# Start the workflow by hand: gh workflow run TestFlight
#
# Repository secrets the workflow reads:
#   APPLE_TEAM_ID   the 10-character Team ID from developer.apple.com, Membership details
#   ASC_KEY_ID      the Key ID of an App Store Connect API team key with the Admin role
#   ASC_ISSUER_ID   the Issuer ID shown above the key list
#   ASC_KEY_P8      the full text of the downloaded AuthKey_<Key ID>.p8 file
on:
  workflow_dispatch:

jobs:
  upload:
    name: Signed build to TestFlight
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v7
      - name: Stop when a secret is missing
        run: |
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set"
              exit 1
            fi
          done
      - name: Write the API key file
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        run: xcodegen generate
      # The archive step does not sign. Development signing needs a registered test device,
      # and a TestFlight build does not. The export step signs with a distribution certificate.
      - name: Archive with signing off
        run: |
          set -o pipefail
          xcodebuild archive             -project DuoKeyboard.xcodeproj             -scheme DuoKeyboard             -configuration Release             -destination 'generic/platform=iOS'             -archivePath build/DuoKeyboard.xcarchive             DEVELOPMENT_TEAM="$APPLE_TEAM_ID"             CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""             CURRENT_PROJECT_VERSION="${{ github.run_number }}" | xcbeautify
      - name: Export and upload to App Store Connect
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/DuoKeyboard.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Delete the API key file
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
