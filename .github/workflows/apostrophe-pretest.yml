name: Apostrophe tests on the code before the fix

# Runs the keyboard tests of Tests/ApostropheWordsTests.swift on the code of engine/lm-keyboard,
# to show that each check fails there. The rule tests of the same file use the new rule and do
# not compile on this code, so this branch holds only the keyboard tests.
on:
  push:
    branches: [engine/apostrophe-words-pretest]

jobs:
  tests:
    name: Apostrophe keyboard tests on engine/lm-keyboard
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Fetch the llama.cpp framework and the language model
        run: bash scripts/ci/fetch_language_model.sh
      - name: Generate the Xcode project
        run: xcodegen generate
      - name: Run the apostrophe tests in a simulator
        run: |
          set -o pipefail
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              for device in devices[runtime]:
                  if device["name"].startswith("iPhone 17"):
                      print(device["udid"])
                      sys.exit(0)
          sys.exit("simulator not found: iPhone 17")
          ')
          xcodebuild test             -project DuoKeyboard.xcodeproj             -scheme DuoKeyboard             -destination "platform=iOS Simulator,id=$udid"             -derivedDataPath build-test             -only-testing:DuoKeyboardTests/ApostropheWordsKeyboardTests             -only-testing:DuoKeyboardTests/ApostropheProofreadingTests | xcbeautify
