name: Language model in the keyboard

# Types the dev cases through the keyboard's own code with the SmolLM2 fine-tune on the macOS simulator,
# and through the harness of scripts/lm-rerank with the same tuned rule on an x86 Linux runner,
# an ARM Linux runner and the macOS runner of the simulator, and compares them case by case and
# correction by correction. scripts/lm-keyboard/README.md describes the
# check. Only the dev half is typed and scored. Every unit test runs as well.
# The jobs whose names start with "Typo set" type the typo set of scripts/typing-evaluation/typo-set
# in the same ways, as new reports. The jobs before them do not read the typo set.
# Each typo-set job builds the cases from real typing errors itself, and redact_real.py removes
# their texts before an upload, because their licences do not allow redistribution.
on:
  push:
    branches: [engine/lm-keyboard, engine/apostrophe-words, engine/domain-pack, ui/swipe-punctuation, engine/domain-model, ui/space-before-mark, ui/closing-quotes, eval/typo-set]
  workflow_dispatch:

concurrency:
  group: lm-keyboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: Linux harness with the tuned rule, and the keyboard's scorer against lm_score
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - name: Build llama.cpp b4846, lm_score, the engine shim, and the keyboard's scorer
        run: |
          set -euo pipefail
          bash scripts/lm-rerank/build_on_linux.sh llama
          mkdir -p build/lm-keyboard
          gcc -std=c11 -O2 -Wall -Wextra -Werror -I build/lm-rerank/llama/include -I LanguageModel \
            LanguageModel/duo_lm_scorer.c scripts/lm-keyboard/scorer_cli.c \
            -L build/lm-rerank/llama/lib -lllama -lggml -lggml-cpu -lggml-base -lm -o build/lm-keyboard/scorer_cli
      - name: Fetch the SmolLM2 fine-tune and check its SHA-256 value
        run: |
          set -euo pipefail
          bash scripts/ci/fetch_language_model.sh model
          echo Shared/smollm2-lora-domain-s100-seed1.Q4_K_M.gguf > build/lm-keyboard/model-path.txt
      - name: Type the dev cases through the harness with the tuned rule
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/build/lm-rerank/llama/lib"
          mkdir -p build/lm-keyboard/harness
          # The processor of the runner, because the products of llama.cpp differ in their last
          # digits between processor families.
          lscpu | grep -E 'Model name|Flags' | tee build/lm-keyboard/harness/runner.txt
          python3 scripts/lm-keyboard/harness_trace.py --shim build/lm-rerank/libduo_shim.so \
            --lm build/lm-rerank/lm_score --model "$(cat build/lm-keyboard/model-path.txt)" --out build/lm-keyboard/harness
      - name: Score the harness requests with lm_score at 4 threads and the keyboard's scorer at 2 threads
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/build/lm-rerank/llama/lib"
          out=build/lm-keyboard/harness
          model="$(cat build/lm-keyboard/model-path.txt)"
          # lm_score writes a line that starts with "ready" before its answers.
          build/lm-rerank/lm_score "$model" 4 < "$out/requests.tsv" 2> "$out/lm_score.log" | tail -n +2 > "$out/lm_score.answers"
          build/lm-keyboard/scorer_cli "$model" 2 < "$out/requests.tsv" > "$out/scorer_cli.answers" 2> "$out/scorer_cli.log"
          {
            echo "requests: $(wc -l < "$out/requests.tsv")"
            echo "lm_score answers: $(wc -l < "$out/lm_score.answers"), scorer_cli answers: $(wc -l < "$out/scorer_cli.answers")"
            if cmp -s "$out/lm_score.answers" "$out/scorer_cli.answers"; then
              echo "the answers are the same byte for byte, 5 decimals each"
            else
              echo "the answers differ in $(diff "$out/lm_score.answers" "$out/scorer_cli.answers" | grep -c '^<') lines"
            fi
            cat "$out/scorer_cli.log"
          } | tee "$out/scorer-check.txt"
          cmp "$out/lm_score.answers" "$out/scorer_cli.answers"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: harness
          path: build/lm-keyboard/harness
          if-no-files-found: error

  harness-arm:
    # The same harness on an ARM processor, which computes like the phone and the simulator.
    name: ARM Linux harness with the tuned rule, and the keyboard's scorer against lm_score
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - name: Build llama.cpp b4846, lm_score, the engine shim, and the keyboard's scorer
        run: |
          set -euo pipefail
          bash scripts/lm-rerank/build_on_linux.sh llama
          mkdir -p build/lm-keyboard
          gcc -std=c11 -O2 -Wall -Wextra -Werror -I build/lm-rerank/llama/include -I LanguageModel \
            LanguageModel/duo_lm_scorer.c scripts/lm-keyboard/scorer_cli.c \
            -L build/lm-rerank/llama/lib -lllama -lggml -lggml-cpu -lggml-base -lm -o build/lm-keyboard/scorer_cli
      - name: Fetch the SmolLM2 fine-tune and check its SHA-256 value
        run: |
          set -euo pipefail
          bash scripts/ci/fetch_language_model.sh model
          echo Shared/smollm2-lora-domain-s100-seed1.Q4_K_M.gguf > build/lm-keyboard/model-path.txt
      - name: Type the dev cases through the harness with the tuned rule
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/build/lm-rerank/llama/lib"
          mkdir -p build/lm-keyboard/harness
          # The processor of the runner, because the products of llama.cpp differ in their last
          # digits between processor families.
          lscpu | grep -E 'Model name|Flags' | tee build/lm-keyboard/harness/runner.txt
          python3 scripts/lm-keyboard/harness_trace.py --shim build/lm-rerank/libduo_shim.so \
            --lm build/lm-rerank/lm_score --model "$(cat build/lm-keyboard/model-path.txt)" --out build/lm-keyboard/harness
      - name: Score the harness requests with lm_score at 4 threads and the keyboard's scorer at 2 threads
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/build/lm-rerank/llama/lib"
          out=build/lm-keyboard/harness
          model="$(cat build/lm-keyboard/model-path.txt)"
          # lm_score writes a line that starts with "ready" before its answers.
          build/lm-rerank/lm_score "$model" 4 < "$out/requests.tsv" 2> "$out/lm_score.log" | tail -n +2 > "$out/lm_score.answers"
          build/lm-keyboard/scorer_cli "$model" 2 < "$out/requests.tsv" > "$out/scorer_cli.answers" 2> "$out/scorer_cli.log"
          {
            echo "requests: $(wc -l < "$out/requests.tsv")"
            echo "lm_score answers: $(wc -l < "$out/lm_score.answers"), scorer_cli answers: $(wc -l < "$out/scorer_cli.answers")"
            if cmp -s "$out/lm_score.answers" "$out/scorer_cli.answers"; then
              echo "the answers are the same byte for byte, 5 decimals each"
            else
              echo "the answers differ in $(diff "$out/lm_score.answers" "$out/scorer_cli.answers" | grep -c '^<') lines"
            fi
            cat "$out/scorer_cli.log"
          } | tee "$out/scorer-check.txt"
          # A report only on this runner: its i8mm kernels pair the rows of one product, so the
          # split of a batch moves some answers in their last digits. The app's framework holds
          # no i8mm instruction, and the x86 and macOS jobs compare byte for byte.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: harness-arm
          path: build/lm-keyboard/harness
          if-no-files-found: error

  keyboard:
    name: Unit tests, the dev cases through the keyboard code with the model, and the harness on the same machine
    runs-on: xcode-27
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Fetch the llama.cpp framework and the language model
        run: bash scripts/ci/fetch_language_model.sh
      - name: Generate the Xcode project
        run: xcodegen generate
      - name: Run every unit test in a simulator, with the typing evaluation on the dev half
        env:
          # xcodebuild hands a variable to the test process when its name starts with TEST_RUNNER_.
          TEST_RUNNER_TYPING_CASES_DIR: ${{ github.workspace }}/scripts/typing-evaluation/cases
          TEST_RUNNER_TYPING_OUTPUT_DIR: ${{ github.workspace }}/build/lm-keyboard/keyboard
          TEST_RUNNER_TYPING_HALVES: dev
          TEST_RUNNER_LANGUAGE_MODEL_OUTPUT_DIR: ${{ github.workspace }}/build/language-model-test
        run: |
          set -o pipefail
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              for device in devices[runtime]:
                  if device["name"].startswith("iPhone 17"):
                      print(device["udid"])
                      sys.exit(0)
          sys.exit("simulator not found: iPhone 17")
          ')
          xcodebuild test \
            -project DuoKeyboard.xcodeproj \
            -scheme DuoKeyboard \
            -destination "platform=iOS Simulator,id=$udid" \
            -derivedDataPath build-test | xcbeautify
      - name: Check that only dev-half files exist, and score the English and symbol dev outputs
        if: always()
        run: |
          set -euo pipefail
          out=build/lm-keyboard/keyboard
          ls -l "$out"
          if ls "$out" | grep -q '\.test\.'; then
            echo "error: the evaluation wrote test-half files" >&2
            exit 1
          fi
          cases=scripts/typing-evaluation/cases
          for task in english english-symbols; do
            for run in "" ".engine-only"; do
              python3 scripts/typing-evaluation/score.py --task english --engine "keyboard$run" \
                --cases "$cases/$task.dev.jsonl" --predictions "$out/$task.dev$run.jsonl" \
                --json "$out/$task.dev$run.summary.json"
            done
          done
          for run in "" ".engine-only"; do
            python3 scripts/typing-evaluation/score_apostrophe_words.py               --cases "$cases/english-apostrophe-words.dev.jsonl"               --word "$out/english-apostrophe-words.dev$run.jsonl"               --next-word "$out/english-apostrophe-words.dev.next-word$run.jsonl"               --json "$out/english-apostrophe-words.dev$run.summary.json"
          done
          cp build/language-model-test/simulator.txt "$out/language-model-test-simulator.txt"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: keyboard
          path: build/lm-keyboard/keyboard
          if-no-files-found: error
      # The harness on this same machine, with lm_score linked against the macOS part of the
      # app's llama.cpp framework. llama.cpp gives other numbers on another machine, so only
      # the same machine separates the code from the machine.
      - name: Build the engine shim, lm_score and the keyboard's scorer against the framework
        if: always()
        run: |
          set -euo pipefail
          mkdir -p build/lm-rerank build/lm-keyboard/harness-mac
          fw="$PWD/Vendor/llama.xcframework/macos-arm64_x86_64"
          clang -std=c11 -O2 -Wall -Wextra -shared -fPIC -I Engine Engine/duo_engine.c scripts/lm-rerank/engine_shim.c \
            -o build/lm-rerank/libduo_shim.so
          clang -std=c11 -O2 -Wall -Wextra -I "$fw/llama.framework/Headers" scripts/lm-rerank/lm_score.c \
            -F "$fw" -framework llama -Wl,-rpath,"$fw" -o build/lm-rerank/lm_score
          clang -std=c11 -O2 -Wall -Wextra -Werror -I LanguageModel -F "$fw" LanguageModel/duo_lm_scorer.c \
            scripts/lm-keyboard/scorer_cli.c -framework llama -Wl,-rpath,"$fw" -o build/lm-keyboard/scorer_cli
          { sysctl -n machdep.cpu.brand_string; sysctl hw.optional | grep -E 'arm|neon|fp16|i8mm|dotprod' || true; } \
            | tee build/lm-keyboard/harness-mac/runner.txt
      - name: Type the dev cases through the harness with the tuned rule, on this machine
        if: always()
        run: |
          set -euo pipefail
          # 2 threads of lm_score, as the runner has 3 cores.
          python3 scripts/lm-keyboard/harness_trace.py --shim build/lm-rerank/libduo_shim.so \
            --lm build/lm-rerank/lm_score --model Shared/smollm2-lora-domain-s100-seed1.Q4_K_M.gguf --threads 2 --out build/lm-keyboard/harness-mac
      - name: Score the harness requests with lm_score and the keyboard's scorer, on this machine
        if: always()
        run: |
          set -euo pipefail
          out=build/lm-keyboard/harness-mac
          model=Shared/smollm2-lora-domain-s100-seed1.Q4_K_M.gguf
          # The runner has 3 cores. More threads than cores make the threads of llama.cpp wait for
          # each other at every step, so both programs run with 2 threads here.
          # lm_score writes a line that starts with "ready" before its answers.
          build/lm-rerank/lm_score "$model" 2 < "$out/requests.tsv" 2> "$out/lm_score.log" | tail -n +2 > "$out/lm_score.answers"
          build/lm-keyboard/scorer_cli "$model" 2 < "$out/requests.tsv" > "$out/scorer_cli.answers" 2> "$out/scorer_cli.log"
          {
            echo "requests: $(wc -l < "$out/requests.tsv" | tr -d ' ')"
            echo "lm_score answers: $(wc -l < "$out/lm_score.answers" | tr -d ' '), scorer_cli answers: $(wc -l < "$out/scorer_cli.answers" | tr -d ' ')"
            if cmp -s "$out/lm_score.answers" "$out/scorer_cli.answers"; then
              echo "the answers are the same byte for byte, 5 decimals each"
            else
              echo "the answers differ in $(diff "$out/lm_score.answers" "$out/scorer_cli.answers" | grep -c '^<') lines"
            fi
            cat "$out/scorer_cli.log"
          } | tee "$out/scorer-check.txt"
          cmp "$out/lm_score.answers" "$out/scorer_cli.answers"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: harness-mac
          path: build/lm-keyboard/harness-mac
          if-no-files-found: error

  device-build:
    name: Release build for the device
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Fetch the llama.cpp framework and the language model
        run: bash scripts/ci/fetch_language_model.sh
      - name: Generate the Xcode project
        run: xcodegen generate
      - name: Build for the device with signing off
        run: |
          set -o pipefail
          xcodebuild \
            -project DuoKeyboard.xcodeproj \
            -scheme DuoKeyboard \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | xcbeautify

  compare:
    name: Keyboard against the harness on its own machine, and the Linux harnesses as reports
    needs: [harness, harness-arm, keyboard]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          path: build/lm-keyboard/artifacts
      - name: Compare
        run: |
          set -euo pipefail
          a=build/lm-keyboard/artifacts
          out=build/lm-keyboard/compare
          # The keyboard must agree case by case with the harness on its own machine, and that
          # comparison sets the result of this job. llama.cpp gives other numbers on other machines,
          # so the comparisons with the Linux harnesses are reports only.
          status=0
          python3 scripts/lm-keyboard/compare.py --reference "$a/harness" --reference-name "x86 harness" \
            --other "$a/keyboard" --other-name keyboard --published --out "$out/x86-harness-keyboard" || true
          python3 scripts/lm-keyboard/compare.py --reference "$a/harness-arm" --reference-name "ARM harness" \
            --other "$a/keyboard" --other-name keyboard --out "$out/arm-harness-keyboard" || true
          python3 scripts/lm-keyboard/compare.py --reference "$a/harness" --reference-name "x86 harness" \
            --other "$a/harness-arm" --other-name "ARM harness" --published --out "$out/x86-harness-arm-harness" || true
          python3 scripts/lm-keyboard/compare.py --reference "$a/harness-mac" --reference-name "macOS harness" \
            --other "$a/keyboard" --other-name keyboard --out "$out/macos-harness-keyboard" || status=1
          python3 scripts/lm-keyboard/compare.py --reference "$a/harness" --reference-name "x86 harness" \
            --other "$a/harness-mac" --other-name "macOS harness" --published --out "$out/x86-harness-macos-harness" || true
          for pair in x86-harness-keyboard arm-harness-keyboard x86-harness-arm-harness macos-harness-keyboard \
              x86-harness-macos-harness; do
            cat "$out/$pair/report.md" >> "$GITHUB_STEP_SUMMARY"
          done
          exit $status
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compare
          path: build/lm-keyboard/compare
          if-no-files-found: error

  typo-harness:
    name: Typo set, Linux harness with the tuned rule
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - name: Keep the real typing-error data between runs
        uses: actions/cache@v4
        with:
          path: build/typo-set/download
          key: typo-set-real-data-${{ hashFiles('scripts/typing-evaluation/typo-set/fetch_real_data.sh') }}
      - name: Build the typo-set cases from real typing errors
        run: |
          set -euo pipefail
          python3 -m venv build/typo-set/venv
          build/typo-set/venv/bin/pip install --quiet wordfreq==3.1.1 gdown==6.5.1 pypinyin==0.55.0 jieba==0.42.1 \
            zipfile-deflate64==0.2.0
          PATH="$PWD/build/typo-set/venv/bin:$PATH" bash scripts/typing-evaluation/typo-set/fetch_real_data.sh
          build/typo-set/venv/bin/python scripts/typing-evaluation/typo-set/build_real_typos.py
      - name: Build llama.cpp b4846, lm_score, the engine shim and the engine's command-line program
        run: |
          set -euo pipefail
          bash scripts/lm-rerank/build_on_linux.sh llama
          mkdir -p build/engine
          gcc -std=c11 -O2 -Wall -Wextra -Werror Engine/duo_engine.c Engine/duo_cli.c -lm -o build/engine/duo_cli
      - name: Fetch the SmolLM2 fine-tune and check its SHA-256 value
        run: bash scripts/ci/fetch_language_model.sh model
      - name: Type the dev cases of the typo set with the engine alone and with the tuned rule
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/build/lm-rerank/llama/lib"
          mkdir -p build/typo-set/harness
          lscpu | grep -E 'Model name|Flags' | tee build/typo-set/harness/runner.txt
          python3 scripts/typing-evaluation/typo-set/run_typos.py --shim build/lm-rerank/libduo_shim.so \
            --cli build/engine/duo_cli --lm build/lm-rerank/lm_score \
            --model Shared/smollm2-lora-domain-s100-seed1.Q4_K_M.gguf --half dev --out build/typo-set/harness
          cat build/typo-set/harness/*.summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the texts of the real-data cases, whose licences do not allow redistribution
        id: redact
        if: always()
        run: python3 scripts/typing-evaluation/typo-set/redact_real.py --folder build/typo-set/harness --cases build/typo-set/cases
      - uses: actions/upload-artifact@v7
        if: always() && steps.redact.outcome == 'success'
        with:
          name: typo-harness
          path: build/typo-set/harness
          if-no-files-found: error

  typo-keyboard:
    name: Typo set, the keyboard code with the model, and the harness on the same machine
    runs-on: xcode-27
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Fetch the llama.cpp framework and the language model
        run: bash scripts/ci/fetch_language_model.sh
      - name: Generate the Xcode project
        run: xcodegen generate
      - name: Keep the real typing-error data between runs
        uses: actions/cache@v4
        with:
          path: build/typo-set/download
          key: typo-set-real-data-${{ hashFiles('scripts/typing-evaluation/typo-set/fetch_real_data.sh') }}
      - name: Build the typo-set cases from real typing errors
        run: |
          set -euo pipefail
          python3 -m venv build/typo-set/venv
          build/typo-set/venv/bin/pip install --quiet wordfreq==3.1.1 gdown==6.5.1 pypinyin==0.55.0 jieba==0.42.1 \
            zipfile-deflate64==0.2.0
          PATH="$PWD/build/typo-set/venv/bin:$PATH" bash scripts/typing-evaluation/typo-set/fetch_real_data.sh
          build/typo-set/venv/bin/python scripts/typing-evaluation/typo-set/build_real_typos.py
      - name: Type the dev cases of the typo set through the keyboard code in a simulator
        env:
          # xcodebuild hands a variable to the test process when its name starts with TEST_RUNNER_.
          TEST_RUNNER_TYPING_CASES_DIR: ${{ github.workspace }}/build/typo-set/all-cases
          TEST_RUNNER_TYPING_TYPO_CASES_DIR: ${{ github.workspace }}/build/typo-set/all-cases
          TEST_RUNNER_TYPING_OUTPUT_DIR: ${{ github.workspace }}/build/typo-set/keyboard
          TEST_RUNNER_TYPING_HALVES: dev
        run: |
          set -o pipefail
          mkdir -p build/typo-set/all-cases
          cp scripts/typing-evaluation/cases/english-typos.dev.jsonl scripts/typing-evaluation/cases/english-typos-capitals.dev.jsonl \
            scripts/typing-evaluation/cases/pinyin-typos.dev.jsonl build/typo-set/cases/*.dev.jsonl build/typo-set/all-cases/
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              for device in devices[runtime]:
                  if device["name"].startswith("iPhone 17"):
                      print(device["udid"])
                      sys.exit(0)
          sys.exit("simulator not found: iPhone 17")
          ')
          xcodebuild test \
            -project DuoKeyboard.xcodeproj \
            -scheme DuoKeyboard \
            -destination "platform=iOS Simulator,id=$udid" \
            -derivedDataPath build-test \
            -only-testing:DuoKeyboardTests/TypingEvaluationTests/testTypoSetEnglishCasesThroughTheTypingController \
            -only-testing:DuoKeyboardTests/TypingEvaluationTests/testTypoSetPinyinCasesThroughThePinyinEngine | xcbeautify
      - name: Check that only dev-half files exist, and score the keyboard outputs
        if: always()
        run: |
          set -euo pipefail
          out=build/typo-set/keyboard
          ls -l "$out"
          if ls "$out" | grep -q '\.test\.'; then
            echo "error: the evaluation wrote test-half files" >&2
            exit 1
          fi
          cases=build/typo-set/all-cases
          for name in english-typos english-typos-capitals english-typos-aalto; do
            for run in "" ".engine-only"; do
              python3 scripts/typing-evaluation/typo-set/score_typos.py --task english --cases "$cases/$name.dev.jsonl" \
                --predictions "$out/$name.dev$run.jsonl" --name "keyboard, $name dev$run" \
                --json "$out/$name.dev$run.summary.json" --markdown "$out/$name.dev$run.summary.md"
            done
          done
          for name in pinyin-typos pinyin-typos-cscd; do
            python3 scripts/typing-evaluation/typo-set/score_typos.py --task pinyin --cases "$cases/$name.dev.jsonl" \
              --predictions "$out/$name.dev.jsonl" --name "keyboard, $name dev" \
              --json "$out/$name.dev.summary.json" --markdown "$out/$name.dev.summary.md"
          done
          cat "$out"/*.summary.md >> "$GITHUB_STEP_SUMMARY"
      # The harness on this same machine, as in the job "keyboard" above.
      - name: Build the engine shim, lm_score and the engine's command-line program against the framework
        if: always()
        run: |
          set -euo pipefail
          mkdir -p build/lm-rerank build/engine build/typo-set/harness-mac
          fw="$PWD/Vendor/llama.xcframework/macos-arm64_x86_64"
          clang -std=c11 -O2 -Wall -Wextra -shared -fPIC -I Engine Engine/duo_engine.c scripts/lm-rerank/engine_shim.c \
            -o build/lm-rerank/libduo_shim.so
          clang -std=c11 -O2 -Wall -Wextra -I "$fw/llama.framework/Headers" scripts/lm-rerank/lm_score.c \
            -F "$fw" -framework llama -Wl,-rpath,"$fw" -o build/lm-rerank/lm_score
          clang -std=c11 -O2 -Wall -Wextra Engine/duo_engine.c Engine/duo_cli.c -lm -o build/engine/duo_cli
          { sysctl -n machdep.cpu.brand_string; sysctl hw.optional | grep -E 'arm|neon|fp16|i8mm|dotprod' || true; } \
            | tee build/typo-set/harness-mac/runner.txt
      - name: Type the dev cases of the typo set through the harness, on this machine
        if: always()
        run: |
          set -euo pipefail
          # 2 threads of lm_score, as the runner has 3 cores.
          python3 scripts/typing-evaluation/typo-set/run_typos.py --shim build/lm-rerank/libduo_shim.so \
            --cli build/engine/duo_cli --lm build/lm-rerank/lm_score \
            --model Shared/smollm2-lora-domain-s100-seed1.Q4_K_M.gguf --threads 2 --half dev --out build/typo-set/harness-mac
      - name: Keyboard against the harness on this machine, case by case, before the texts are removed
        run: |
          set -euo pipefail
          python3 scripts/typing-evaluation/typo-set/compare_typos.py --reference build/typo-set/harness-mac \
            --reference-name "macOS harness" --other build/typo-set/keyboard --other-name keyboard --half dev \
            --out build/typo-set/harness-mac/compare-with-texts --strict
          cat build/typo-set/harness-mac/compare-with-texts/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the texts of the real-data cases, whose licences do not allow redistribution
        id: redact
        if: always()
        run: |
          set -euo pipefail
          python3 scripts/typing-evaluation/typo-set/redact_real.py --folder build/typo-set/keyboard --cases build/typo-set/cases
          python3 scripts/typing-evaluation/typo-set/redact_real.py --folder build/typo-set/harness-mac --cases build/typo-set/cases
      - uses: actions/upload-artifact@v7
        if: always() && steps.redact.outcome == 'success'
        with:
          name: typo-keyboard
          path: build/typo-set/keyboard
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always() && steps.redact.outcome == 'success'
        with:
          name: typo-harness-mac
          path: build/typo-set/harness-mac
          if-no-files-found: error

  typo-compare:
    name: Typo set, keyboard against the harness on its own machine and the engine alone on Linux
    needs: [typo-harness, typo-keyboard]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: typo-*
          path: build/typo-set/artifacts
      - name: Compare
        run: |
          set -euo pipefail
          a=build/typo-set/artifacts
          out=build/typo-set/compare
          # The keyboard must agree case by case with the harness on its own machine, and with the
          # engine alone on Linux. llama.cpp gives other numbers on another machine, so the Linux
          # comparison with the model is a report only.
          status=0
          python3 scripts/typing-evaluation/typo-set/compare_typos.py --reference "$a/typo-harness-mac" \
            --reference-name "macOS harness" --other "$a/typo-keyboard" --other-name keyboard --half dev \
            --out "$out/macos-harness-keyboard" --strict || status=1
          python3 scripts/typing-evaluation/typo-set/compare_typos.py --reference "$a/typo-harness" \
            --reference-name "x86 harness" --other "$a/typo-keyboard" --other-name keyboard --half dev \
            --out "$out/x86-harness-keyboard" --strict-engine-only || status=1
          cat "$out/macos-harness-keyboard/report.md" "$out/x86-harness-keyboard/report.md" >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: typo-compare
          path: build/typo-set/compare
          if-no-files-found: error

  typo-unchanged:
    name: Typo set, the existing outputs against the reference run of the build 44 code
    # The reference run 43577907274 typed commit 29b7427, the code of build 44. The check is for
    # the branch of the typo set only. llama.cpp computes other last digits on another processor,
    # so the x86 harness and its comparisons may differ: the report counts them, and they do not
    # fail the job.
    if: github.ref == 'refs/heads/eval/typo-set'
    needs: [harness, harness-arm, keyboard, compare]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: compare
          path: build/typo-set/unchanged/this/compare
      - uses: actions/download-artifact@v7
        with:
          name: harness
          path: build/typo-set/unchanged/this/harness
      - uses: actions/download-artifact@v7
        with:
          name: harness-arm
          path: build/typo-set/unchanged/this/harness-arm
      - uses: actions/download-artifact@v7
        with:
          name: harness-mac
          path: build/typo-set/unchanged/this/harness-mac
      - uses: actions/download-artifact@v7
        with:
          name: keyboard
          path: build/typo-set/unchanged/this/keyboard
      - name: Compare every existing output case by case
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          u=build/typo-set/unchanged
          gh run download 43577907274 --repo "${{ github.repository }}" -D "$u/reference"
          python3 scripts/typing-evaluation/typo-set/check_unchanged.py --reference "$u/reference" --other "$u/this" \
            --out "$u/report.md" --allow-differ 'harness/*' --allow-differ 'compare/x86-harness-*'
          cat "$u/report.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: typo-unchanged
          path: build/typo-set/unchanged/report.md
          if-no-files-found: error
