name: Domain pack

# Measures the vocabulary pack "AI and software" through the Linux harness of scripts/lm-rerank:
# the cases of cases/english-domain and cases/english-domain-stream, the existing English dev
# cases and the apostrophe words, each with the pack off and on, with the engine alone and with
# the keyboard's SmolLM2 fine-tune. docs/domain-pack-design.md describes the measurement.
# GitHub starts a dispatched workflow only from the default branch, so a push starts this one.
# Every run types the dev half. A run types the test half as well only when the message of its
# commit holds the mark [test-half]. Two runs read the test half, for the same settings: run
# 43142372002, and the run of the commit that added 16 requested words and their cases.
on:
  push:
    branches: [engine/domain-pack]
    paths:
      - 'Engine/**'
      - 'Shared/lexicon-english.bin'
      - 'Shared/supplement-ai-software.*'
      - 'scripts/lm-rerank/**'
      - 'scripts/lm-keyboard/harness_trace.py'
      - 'scripts/typing-evaluation/**'
      - 'scripts/domain-pack/check_supplement.py'
      - 'scripts/domain-pack/requested_frequency.py'
      - 'scripts/domain-pack/build_merged_lexicon.py'
      - 'scripts/domain-pack/variants/**'
      - '.github/workflows/domain-pack.yml'
      - '.github/run-every-workflow.txt'

env:
  # The commit of engine/lm-keyboard that this branch starts from: the engine before the supplement.
  BASE: 4cfa7ef

concurrency:
  group: domain-pack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine checks, and the engine alone with the pack off and on
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build the engine, the engine before the supplement, the shim and the readings check
        run: |
          set -euo pipefail
          mkdir -p build/engine build/base-engine
          for file in duo_engine.c duo_engine.h duo_cli.c; do git show "$BASE:Engine/$file" > "build/base-engine/$file"; done
          # The engine before the supplement holds the symbol keys of the layout of its commit. It gets
          # the symbol keys of the layout file of this commit, so the comparison below reads the
          # change of the supplement alone.
          python3 scripts/typing-evaluation/symbol_keys.py --write-engine-table build/base-engine/duo_engine.c
          gcc -std=c11 -O2 -Wall -Wextra -Werror build/base-engine/duo_engine.c build/base-engine/duo_cli.c -lm -o build/engine/duo_cli_base
          gcc -std=c11 -O2 -Wall -Wextra -Werror Engine/duo_engine.c Engine/duo_cli.c -lm -o build/engine/duo_cli
          bash scripts/lm-rerank/build_on_linux.sh
      - name: Without a supplement, the engine gives the outputs of the engine before the change
        run: |
          set -euo pipefail
          for task in english english-symbols english-apostrophe-words pinyin; do
            python3 scripts/typing-evaluation/run_duo_engine.py --task "$task" --half dev --cli build/engine/duo_cli_base --name base > /dev/null
            python3 scripts/typing-evaluation/run_duo_engine.py --task "$task" --half dev --cli build/engine/duo_cli --name new > /dev/null
            cmp "build/typing-evaluation/duo-engine/base.$task.dev.jsonl" "build/typing-evaluation/duo-engine/new.$task.dev.jsonl"
            echo "$task dev: the outputs are the same, $(wc -l < "build/typing-evaluation/duo-engine/new.$task.dev.jsonl") cases"
          done
      - name: The checks of the supplement and of the preferred capitals hold, and fail on the engine before the change
        run: |
          set -euo pipefail
          python3 scripts/domain-pack/check_supplement.py --cli build/engine/duo_cli
          if python3 scripts/domain-pack/check_supplement.py --cli build/engine/duo_cli_base --only engine; then
            echo "error: the checks pass on the engine before the change" >&2
            exit 1
          fi
          echo "the checks fail on the engine before the change, as they must"
      - name: Check duo_english_readings with the supplement under the memory checks
        run: |
          set -euo pipefail
          python3 - > build/lm-rerank/readings-input.tsv <<'EOF'
          import json
          for name in ["english.dev.jsonl", "english-symbols.dev.jsonl", "english-apostrophe-words.dev.jsonl", "english-domain.dev.jsonl"]:
              for line in open("scripts/typing-evaluation/cases/" + name, encoding="utf-8"):
                  case = json.loads(line)
                  words = [w for w in case["context"].lower().split(" ") if w]
                  previous = words[-1] if words and words[-1].isalpha() else ""
                  print(f"{case['id']}\t{previous}\t{case['typed'].lower()}")
          EOF
          build/lm-rerank/readings_check Shared/lexicon-english.bin < build/lm-rerank/readings-input.tsv
          build/lm-rerank/readings_check Shared/lexicon-english.bin Shared/supplement-ai-software.bin < build/lm-rerank/readings-input.tsv
      - name: Type the cases with the engine alone, with the pack off, on, and merged into the lexicon
        run: |
          set -euo pipefail
          mkdir -p build/domain-pack
          python3 scripts/domain-pack/build_merged_lexicon.py --out build/domain-pack/lexicon-english-merged.bin | tee build/domain-pack/merged.txt
          cp build/lm-rerank/libduo_shim.so build/lm-rerank/libduo_shim_merged.so
          python3 scripts/lm-rerank/domain_pack.py --shim build/lm-rerank/libduo_shim.so --half dev \
            --merged-lexicon build/domain-pack/lexicon-english-merged.bin --merged-shim build/lm-rerank/libduo_shim_merged.so \
            --out build/lm-rerank/domain-pack/engine
          python3 scripts/lm-rerank/domain_pack_table.py build/lm-rerank/domain-pack/engine/result.dev.json \
            | tee build/lm-rerank/domain-pack/engine/table.dev.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: domain-pack-engine-dev
          path: |
            build/lm-rerank/domain-pack/engine
            build/domain-pack/merged.txt
          if-no-files-found: error

  rerank:
    # Each share of domain text is one set of frequencies for the same words (build_pack.py
    # --frequency-share). scripts/lm-rerank/domain_pack_shares.py picks the share from the dev
    # results of this job. The files of share 0.3 are the files of Shared, which ship.
    name: SmolLM2 fine-tune through the harness, dev half, share of domain text ${{ matrix.share }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        share: ['0.03', '0.1', '0.3', '1.0']
    steps:
      - uses: actions/checkout@v7
      - name: Build llama.cpp b4846, the scorer and the engine shim
        run: bash scripts/lm-rerank/build_on_linux.sh llama
      - name: Fetch the SmolLM2 fine-tune and check its SHA-256 value
        run: bash scripts/ci/fetch_language_model.sh model
      - name: Type the dev cases through the harness
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/build/lm-rerank/llama/lib"
          mkdir -p build/lm-rerank/domain-pack/rerank
          lscpu | grep -E 'Model name' | tee build/lm-rerank/domain-pack/rerank/runner.txt
          variant="scripts/domain-pack/variants/share-${{ matrix.share }}"
          # The dev half also types the alternative that leaves the protection out.
          python3 scripts/lm-rerank/domain_pack.py --shim build/lm-rerank/libduo_shim.so --lm build/lm-rerank/lm_score \
            --model Shared/smollm2-lora-domain-s100-seed1.Q4_K_M.gguf --threads 4 --half dev --also-unprotected \
            --supplement "$variant/supplement-ai-software.bin" --table "$variant/supplement-ai-software.tsv" \
            --out build/lm-rerank/domain-pack/rerank
          python3 scripts/lm-rerank/domain_pack_table.py build/lm-rerank/domain-pack/rerank/result.dev.json \
            | tee build/lm-rerank/domain-pack/rerank/table.dev.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: domain-pack-rerank-dev-share-${{ matrix.share }}
          path: build/lm-rerank/domain-pack/rerank
          if-no-files-found: error

  requested-frequency:
    # The frequency of the requested words (REQUESTED_ZIPF of build_pack.py), and the frequency
    # of each word that has its own in pack/required-terms.tsv. All on dev cases.
    name: Frequencies for the requested words, dev cases
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - name: Build llama.cpp b4846, the scorer and the engine shim
        run: bash scripts/lm-rerank/build_on_linux.sh llama
      - name: Fetch the SmolLM2 fine-tune and check its SHA-256 value
        run: bash scripts/ci/fetch_language_model.sh model
      - name: Type the dev cases of each word with a frequency of its own, at each frequency
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/build/lm-rerank/llama/lib"
          out=build/lm-rerank/domain-pack/requested
          mkdir -p "$out"
          # The words of pack/required-terms.tsv whose third column holds a frequency.
          words=$(grep -v '^#' scripts/domain-pack/pack/required-terms.tsv | awk -F'\t' 'NR > 1 && $3 != "" { print $1 }')
          test -n "$words"
          for word in $words; do
            python3 scripts/domain-pack/requested_frequency.py --shim build/lm-rerank/libduo_shim.so --lm build/lm-rerank/lm_score \
              --model Shared/smollm2-lora-domain-s100-seed1.Q4_K_M.gguf --threads 4 --word "$word" --out "$out/$word" \
              | tee "$out/requested-frequency-$word.md"
            cat "$out/requested-frequency-$word.md" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Type the dev cases of the other requested words at each frequency
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/build/lm-rerank/llama/lib"
          out=build/lm-rerank/domain-pack/requested
          python3 scripts/domain-pack/requested_frequency.py --shim build/lm-rerank/libduo_shim.so --lm build/lm-rerank/lm_score \
            --model Shared/smollm2-lora-domain-s100-seed1.Q4_K_M.gguf --threads 4 --out "$out/all" \
            | tee "$out/requested-frequency.md"
          cat "$out/requested-frequency.md" >> "$GITHUB_STEP_SUMMARY"
          rm -f "$out"/*/*.so "$out"/*/*.bin
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: domain-pack-requested-frequency
          path: build/lm-rerank/domain-pack/requested
          if-no-files-found: error

  rerank-test:
    # The test half, for the pack and the settings that ship. See the note at the top of this file.
    name: SmolLM2 fine-tune through the harness, test half
    if: ${{ github.event.head_commit.message != '' && contains(github.event.head_commit.message, '[test-half]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - name: Build llama.cpp b4846, the scorer and the engine shim
        run: bash scripts/lm-rerank/build_on_linux.sh llama
      - name: Fetch the SmolLM2 fine-tune and check its SHA-256 value
        run: bash scripts/ci/fetch_language_model.sh model
      - name: Type the test cases through the harness
        run: |
          set -euo pipefail
          cmp Shared/supplement-ai-software.bin scripts/domain-pack/variants/share-0.3/supplement-ai-software.bin
          cmp Shared/supplement-ai-software.tsv scripts/domain-pack/variants/share-0.3/supplement-ai-software.tsv
          export LD_LIBRARY_PATH="$PWD/build/lm-rerank/llama/lib"
          mkdir -p build/lm-rerank/domain-pack/rerank
          lscpu | grep -E 'Model name' | tee build/lm-rerank/domain-pack/rerank/runner.txt
          python3 scripts/lm-rerank/domain_pack.py --shim build/lm-rerank/libduo_shim.so --lm build/lm-rerank/lm_score \
            --model Shared/smollm2-lora-domain-s100-seed1.Q4_K_M.gguf --threads 4 --half test \
            --out build/lm-rerank/domain-pack/rerank
          python3 scripts/lm-rerank/domain_pack_table.py build/lm-rerank/domain-pack/rerank/result.test.json \
            | tee build/lm-rerank/domain-pack/rerank/table.test.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: domain-pack-rerank-test
          path: build/lm-rerank/domain-pack/rerank
          if-no-files-found: error
