# XcodeGen spec. `xcodegen generate` turns this file into DuoKeyboard.xcodeproj on the build Mac.
name: DuoKeyboard
options:
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: "NO"
targets:
  DuoKeyboard:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      # The C typing engine. duo_cli.c is the command-line driver for the evaluation.
      # The engine is compiled with -O2 in every configuration, because a debug build of the
      # search is several times slower and the unit tests run thousands of typing cases.
      - path: Engine
        excludes:
          - duo_cli.c
        compilerFlags: "-O2"
      # The language model test in C. It calls llama.cpp, which comes as a framework. The test
      # times its own loops over the vocabulary too, so it is compiled with -O2 like the engine.
      - path: LanguageModel
        compilerFlags: "-O2"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Duo Keyboard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yilongju.duokeyboard
        PRODUCT_NAME: DuoKeyboard
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: Engine/DuoEngine-Bridging-Header.h
    dependencies:
      - target: DuoKeyboardExtension
      # llama.cpp, for the language model test. scripts/ci/fetch_language_model.sh downloads the
      # framework. The app holds the one copy, and the keyboard extension loads that copy.
      - framework: Vendor/llama.xcframework
        embed: true
  DuoKeyboardExtension:
    type: app-extension
    platform: iOS
    sources:
      - Keyboard
      - Shared
      - path: Engine
        excludes:
          - duo_cli.c
        compilerFlags: "-O2"
      # The language model test in C. It calls llama.cpp, which comes as a framework. The test
      # times its own loops over the vocabulary too, so it is compiled with -O2 like the engine.
      - path: LanguageModel
        compilerFlags: "-O2"
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Duo Keyboard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yilongju.duokeyboard.keyboard
        PRODUCT_NAME: DuoKeyboardExtension
        SWIFT_OBJC_BRIDGING_HEADER: Engine/DuoEngine-Bridging-Header.h
    dependencies:
      # The extension links llama.cpp and finds it at run time in the Frameworks folder of the app.
      - framework: Vendor/llama.xcframework
        embed: false
  DuoKeyboardTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: DuoKeyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yilongju.duokeyboard.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/DuoKeyboard.app/DuoKeyboard
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  DuoKeyboard:
    build:
      targets:
        DuoKeyboard: all
        DuoKeyboardExtension: all
    test:
      config: Debug
      targets:
        - DuoKeyboardTests
    run:
      config: Debug
    archive:
      config: Release
