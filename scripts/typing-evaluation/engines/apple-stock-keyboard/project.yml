# XcodeGen spec for the stock-keyboard measurement. `xcodegen generate` in this folder turns the
# file into StockKeyboardHost.xcodeproj on the build Mac. The project holds a host app with one
# text view and a UI test that taps the keys of the simulator's software keyboard.
name: StockKeyboardHost
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  StockKeyboardHost:
    type: application
    platform: iOS
    sources:
      - HostApp
    info:
      path: HostApp/Info.plist
      properties:
        CFBundleDisplayName: Stock Keyboard Host
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.typingevaluation.stockkeyboardhost
        PRODUCT_NAME: StockKeyboardHost
        GENERATE_INFOPLIST_FILE: "NO"
  StockKeyboardUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: StockKeyboardHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.typingevaluation.stockkeyboardhost.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: StockKeyboardHost
        SWIFT_OBJC_BRIDGING_HEADER: UITests/BridgingHeader.h
schemes:
  StockKeyboardHost:
    build:
      targets:
        StockKeyboardHost: all
        StockKeyboardUITests: [test]
    test:
      config: Debug
      targets:
        - StockKeyboardUITests
    run:
      config: Debug
